body::before {
  /* The floor pattern is faint in the game; this keeps it faint here. */
  content: ""; position: fixed; inset: 0;
  background: rgba(220, 199, 160, .82); pointer-events: none;
}
#app {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto;
  display: flex; flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
  touch-action: none; user-select: none;
}
header h1 { margin: 4px 0 10px; font-size: clamp(22px, 6.4vw, 32px); font-weight: 800; letter-spacing: -.01em; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.chip { background: var(--chip); border-radius: 12px; padding: 6px 12px 8px; box-shadow: 0 2px 0 rgba(67,48,31,.08); }
.chip small { display: block; font-size: 11px; font-weight: 700; color: var(--ink-faint); letter-spacing: .06em; }
.chip b { font-size: clamp(20px, 6vw, 28px); font-weight: 800; }
.chip b.moves { color: var(--accent); }
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; margin: 12px 0; }
canvas { display: block; }
.hint { min-height: 2.6em; text-align: center; font-size: 15px; font-weight: 600; color: var(--ink-faint); margin: 0 0 10px; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
button {
  font: inherit; font-weight: 800; font-size: 17px; color: var(--ink);
  background: var(--chip); border: 0; border-radius: 12px; padding: 13px 10px;
  box-shadow: 0 3px 0 rgba(67,48,31,.14); cursor: pointer;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(67,48,31,.14); }
button:disabled { color: var(--ink-faint); }
button.primary { background: var(--accent); color: #fff8ee; box-shadow: 0 3px 0 var(--accent-deep); }
.store { display: block; text-align: center; margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--accent-deep); }

.overlay {
  position: fixed; inset: 0; z-index: 5; display: none;
  align-items: center; justify-content: center; padding: 16px;
  background: rgba(67,48,31,.32);
}
.overlay.show { display: flex; }
.panel {
  width: min(420px, 100%); background: #f8efdc; border-radius: 20px;
  padding: 22px 22px 20px; text-align: center; box-shadow: 0 6px 0 rgba(67,48,31,.22);
}
.panel .lvl { font-weight: 700; color: var(--ink-faint); }
.panel h2 { margin: 2px 0 8px; font-size: 34px; font-weight: 800; }
.paws { display: flex; justify-content: center; gap: 18px; margin: 4px 0 8px; }
.paws svg { width: 56px; height: 56px; transform: scale(.4); opacity: 0; transition: transform .28s cubic-bezier(.3,1.6,.5,1), opacity .2s; }
.paws svg.on { transform: scale(1); opacity: 1; }
.panel p { margin: 6px 0 16px; color: var(--ink-faint); font-weight: 600; }
.panel .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#end img { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 4px 0 rgba(67,48,31,.16); }
#end h2 { margin-top: 12px; }
#end button.primary { width: 100%; font-size: 20px; padding: 16px; }
#end .again { background: none; box-shadow: none; color: var(--ink-faint); font-size: 15px; margin-top: 6px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>If I Fits, I Sits</h1>
    <div class="chips">
      <div class="chip"><small>LEVEL</small><b id="c-level">1/3</b></div>
      <div class="chip"><small>TARGET</small><b id="c-par">3</b></div>
      <div class="chip"><small>MOVES</small><b id="c-moves" class="moves">0</b></div>
    </div>
  </header>
  <div id="stage"><canvas id="board" aria-label="Puzzle board"></canvas></div>
  <p class="hint" id="hint"></p>
  <div class="controls">
    <button id="b-undo">Undo</button>
    <button id="b-restart">Restart</button>
  </div>
  <a class="store" id="l-store" href="#">Full game free on Google Play</a>
</div>

<div class="overlay" id="win">
  <div class="panel">
    <div class="lvl" id="w-level">Level 1</div>
    <h2>Fits. Sits.</h2>
    <div class="paws" id="w-paws"></div>
    <p id="w-sub"></p>
    <div class="row"><button id="w-replay">Replay</button><button class="primary" id="w-next">Next</button></div>
  </div>
</div>

const ANCHORS = {"orange": {"in_box": [189.8, 337.9], "sit": [171.0, 387.3], "slide_side": [229.4, 211.3]}, "grey": {"in_box": [193.2, 340.4], "sit": [175.3, 392.5], "slide_side": [233.2, 215.6]}};
const COLOURS = ["orange", "grey"];

// Board cat sizing, from godot/scripts/cat_sprites.gd.
const SIT_H = 0.98, FLOOR = 0.40, SIT_PX = 384;
const PAL = {
  floorA: "#ebd8b4", floorB: "#e6d2ac", grid: "rgba(120,92,58,.14)", rim: "#d6c09a",
  furn: "#8a6a4f", furnTop: "#a07f60", furnEdge: "#6b4f39",
  box: "#cba164", boxLip: "#ddb77c", boxIn: "#7e5d33", boxTape: "rgba(228,207,164,.55)",
  shadow: "rgba(67,48,31,.25)",
};
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

// ------------------------------------------------------------------- rules
// A port of godot/scripts/slide_engine.gd. Every cat slides in the swipe's
// direction until a wall, furniture or another cat stops her; the cat furthest
// along the direction resolves first, so cats at rest block the ones behind.
function slide(walls, w, h, pos, d) {
  const order = pos.map((_, i) => i).sort((a, b) =>
    (pos[b][0] * d[0] + pos[b][1] * d[1]) - (pos[a][0] * d[0] + pos[a][1] * d[1]));
  const occupied = new Set(pos.map(p => p[1] * w + p[0]));
  const next = pos.map(p => p.slice());
  const dist = pos.map(() => 0);
  for (const i of order) {
    let [x, y] = next[i];
    occupied.delete(y * w + x);
    for (;;) {
      const nx = x + d[0], ny = y + d[1];
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) break;
      const k = ny * w + nx;
      if (walls.has(k) || occupied.has(k)) break;
      x = nx; y = ny; dist[i]++;
    }
    next[i] = [x, y];
    occupied.add(y * w + x);
  }
  return { next, dist };
}
const inBox = (p, G) => G.boxes.has(p[1] * G.w + p[0]);
const isWon = G => G.cats.every(p => inBox(p, G));
function paws(moves, par) { return moves <= par ? 3 : moves <= par + 2 ? 2 : 1; }

// ------------------------------------------------------------------- state
const G = { level: 0 };
function load(n) {
  const L = LEVELS[n];
  G.level = n; G.w = L.grid[0].length; G.h = L.grid.length; G.par = L.par;
  G.walls = new Set(); G.boxes = new Set(); G.cats = [];
  L.grid.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === "#") G.walls.add(y * G.w + x);
    else if (c === "B") G.boxes.add(y * G.w + x);
    else if (c === "C") G.cats.push([x, y]);
  }));
  G.start = G.cats.map(p => p.slice());
  G.moves = 0; G.history = []; G.won = false; G.anim = null; G.buffered = null;
  G.impact = -9; G.impactX = true; G.lastInput = performance.now();
  document.getElementById("hint").textContent = L.hint;
  hide("win"); hud(); fit();
}
function hud() {
  document.getElementById("c-level").textContent = `${G.level + 1}/${LEVELS.length}`;
  document.getElementById("c-par").textContent = G.par;
  document.getElementById("c-moves").textContent = G.moves;
  document.getElementById("b-undo").disabled = G.history.length === 0 || G.won;
}

function move(name) {
  if (G.won) return;
  if (G.anim) { G.buffered = name; return; }
  const d = DIRS[name];
  const res = slide(G.walls, G.w, G.h, G.cats, d);
  G.lastInput = performance.now();
  const far = Math.max(...res.dist);
  if (far === 0) { G.shake = performance.now(); return; }
  G.history.push(G.cats.map(p => p.slice()));
  G.anim = { from: G.cats.map(p => p.slice()), to: res.next, dir: d,
             t0: performance.now(), dur: 90 + 70 * far };
  G.cats = res.next;
  G.moves++;
  hud();
}
function land() {
  G.anim = null;
  G.impact = performance.now();
  if (isWon(G)) { G.won = true; hud(); setTimeout(showWin, 420); return; }
  if (G.buffered) { const b = G.buffered; G.buffered = null; move(b); }
}
function undo() {
  if (G.won || G.anim || !G.history.length) return;
  G.cats = G.history.pop(); G.moves--; hud();
}
function restart() { load(G.level); }

// ------------------------------------------------------------------ panels
function show(id) { document.getElementById(id).classList.add("show"); }
function hide(id) { document.getElementById(id).classList.remove("show"); }
const PAW = on => `<svg viewBox="0 0 64 64"><g fill="${on ? "#e8823c" : "#c9b48f"}" stroke="#7a3f14" stroke-width="${on ? 3 : 0}">
  <ellipse cx="32" cy="42" rx="15" ry="13"/><circle cx="14" cy="27" r="7"/><circle cx="25" cy="17" r="7"/>
  <circle cx="39" cy="17" r="7"/><circle cx="50" cy="27" r="7"/></g>
  <g fill="${on ? "#f6a9b4" : "#dccbaa"}"><ellipse cx="32" cy="43" rx="9" ry="7.5"/><circle cx="14" cy="27" r="3.6"/>
  <circle cx="25" cy="17" r="3.6"/><circle cx="39" cy="17" r="3.6"/><circle cx="50" cy="27" r="3.6"/></g></svg>`;
function showWin() {
  const earned = paws(G.moves, G.par);
  document.getElementById("w-level").textContent = `Level ${G.level + 1} of ${LEVELS.length}`;
  document.getElementById("w-sub").textContent = G.moves <= G.par
    ? `Purrfect - solved in target, ${G.moves} moves`
    : `Solved in ${G.moves}. Target was ${G.par}.`;
  const box = document.getElementById("w-paws");
  box.innerHTML = [0, 1, 2].map(i => PAW(i < earned)).join("");
  // One at a time, as in the game.
  [...box.children].forEach((s, i) => setTimeout(() => s.classList.add("on"), 250 + i * 330));
  document.getElementById("w-next").textContent = G.level + 1 < LEVELS.length ? "Next" : "Done";
  show("win");
}

// ------------------------------------------------------------------ drawing
const cv = document.getElementById("board");
const ctx = cv.getContext("2d");
// Older ad webviews predate roundRect.
if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
    this.closePath();
  };
}
let cell = 80, dpr = 1;
function fit() {
  const st = document.getElementById("stage");
  const availW = st.clientWidth, availH = st.clientHeight;
  cell = Math.floor(Math.min(availW / G.w, availH / G.h));
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = `${cell * G.w}px`; cv.style.height = `${cell * G.h}px`;
  cv.width = Math.round(cell * G.w * dpr); cv.height = Math.round(cell * G.h * dpr);
}
addEventListener("resize", () => { if (G.w) fit(); });

function rr(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}
function drawFloor() {
  const W = cell * G.w, H = cell * G.h;
  rr(0, 0, W, H, cell * 0.12, PAL.floorA);
  ctx.save(); ctx.beginPath(); ctx.roundRect(0, 0, W, H, cell * 0.12); ctx.clip();
  for (let y = 0; y < G.h; y++) if (y % 2) { ctx.fillStyle = PAL.floorB; ctx.fillRect(0, y * cell, W, cell); }
  ctx.strokeStyle = PAL.grid; ctx.lineWidth = 1;
  for (let x = 1; x < G.w; x++) { ctx.beginPath(); ctx.moveTo(x * cell, 0); ctx.lineTo(x * cell, H); ctx.stroke(); }
  for (let y = 1; y < G.h; y++) { ctx.beginPath(); ctx.moveTo(0, y * cell); ctx.lineTo(W, y * cell); ctx.stroke(); }
  ctx.restore();
  ctx.lineWidth = 2; ctx.strokeStyle = PAL.rim;
  ctx.beginPath(); ctx.roundRect(1, 1, W - 2, H - 2, cell * 0.12); ctx.stroke();
}
function drawPiece(x, y) {
  const px = x * cell, py = y * cell;
  rr(px + 2, py + 4, cell - 4, cell - 5, 5, PAL.furnEdge);
  rr(px + 2, py + 2, cell - 4, cell - 6, 5, PAL.furn);
  rr(px + 5, py + 5, cell - 10, (cell - 6) * 0.32, 3, PAL.furnTop);
}
function boxBack(x, y) {
  const px = x * cell, py = y * cell, m = cell * 0.08, im = cell * 0.23;
  rr(px + m, py + m, cell - 2 * m, cell - 2 * m, cell * 0.07, PAL.box);
  ctx.strokeStyle = PAL.boxLip; ctx.lineWidth = 1;
  for (const [a, b] of [[[m, m], [im, im]], [[cell - m, m], [cell - im, im]],
                        [[m, cell - m], [im, cell - im]], [[cell - m, cell - m], [cell - im, cell - im]]]) {
    ctx.beginPath(); ctx.moveTo(px + a[0], py + a[1]); ctx.lineTo(px + b[0], py + b[1]); ctx.stroke();
  }
  rr(px + im, py + im, cell - 2 * im, cell - 2 * im, cell * 0.04, PAL.boxIn);
}
function boxFront(x, y) {
  const px = x * cell, py = y * cell, m = cell * 0.08, im = cell * 0.23;
  ctx.beginPath();
  ctx.moveTo(px + im, py + cell - im); ctx.lineTo(px + cell - im, py + cell - im);
  ctx.lineTo(px + cell - m, py + cell - m); ctx.lineTo(px + m, py + cell - m);
  ctx.closePath(); ctx.fillStyle = PAL.box; ctx.fill();
  ctx.fillStyle = PAL.boxTape; ctx.fillRect(px + cell * 0.44, py + cell - im, cell * 0.12, im - m);
  ctx.strokeStyle = PAL.boxIn; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(px + m, py + m, cell - 2 * m, cell - 2 * m, cell * 0.07); ctx.stroke();
}
function ellipse(cx, cy, rx, ry, fill) {
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill();
}
const IMG = {};
// Same placement as CatSprites.draw: the pose's anchor goes on her floor point.
function drawCat(i, gx, gy, pose, sx, sy, dir) {
  const colour = COLOURS[i % COLOURS.length];
  const img = IMG[colour][pose], a = ANCHORS[colour][pose];
  const k = SIT_H * cell / SIT_PX;
  const cx = (gx + 0.5) * cell, cy = (gy + 0.5) * cell;
  if (pose === "slide_side" && dir && dir[0] === 0) {
    // Up and down use the side slide turned so her head leads.
    ellipse(cx, cy + cell * 0.04, cell * 0.15 * sx, cell * 0.40 * sy, PAL.shadow);
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(dir[1] < 0 ? -Math.PI / 2 : Math.PI / 2);
    ctx.scale(sy, sx);
    ctx.drawImage(img, -img.width * k / 2, -img.height * k / 2, img.width * k, img.height * k);
    ctx.restore(); return;
  }
  const fx = cx, fy = cy + FLOOR * cell;
  if (pose !== "in_box") ellipse(fx, fy - cell * 0.02, cell * (pose === "slide_side" ? 0.42 : 0.30) * sx, cell * 0.07, PAL.shadow);
  ctx.save(); ctx.translate(fx, fy);
  ctx.scale(pose === "slide_side" && dir && dir[0] < 0 ? -sx : sx, sy);
  ctx.drawImage(img, -a[0] * k, -a[1] * k, img.width * k, img.height * k);
  ctx.restore();
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!G.w) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  drawFloor();
  G.walls.forEach(k => drawPiece(k % G.w, Math.floor(k / G.w)));
  G.boxes.forEach(k => boxBack(k % G.w, Math.floor(k / G.w)));

  let t = 1;
  if (G.anim) {
    t = Math.min(1, (now - G.anim.t0) / G.anim.dur);
    // Landing may start the buffered swipe, which begins at its own t = 0.
    if (t >= 1) { land(); t = G.anim ? 0 : 1; }
  }
  const e = 1 - Math.pow(1 - t, 3);
  G.cats.forEach((p, i) => {
    let gx = p[0], gy = p[1], pose = "sit", sx = 1, sy = 1, dir = null;
    if (G.anim) {
      const f = G.anim.from[i], to = G.anim.to[i];
      gx = f[0] + (to[0] - f[0]) * e; gy = f[1] + (to[1] - f[1]) * e;
      if (f[0] !== to[0] || f[1] !== to[1]) {
        pose = "slide_side"; dir = G.anim.dir;
        [sx, sy] = dir[0] !== 0 ? [1.14, 0.90] : [0.90, 1.14];
      }
    } else {
      if (inBox(p, G)) {
        pose = "in_box";
        const b = Math.sin(now / 1000 * 1.6) * 0.022; sx += b; sy -= b;
      }
      const el = (now - G.impact) / 1000;
      if (el < 0.55) {
        const kk = 0.3 * Math.exp(-el * 9) * Math.cos(el * 34);
        sx *= 1 + kk * 0.5; sy *= 1 - kk * 0.5;
      }
    }
    if (G.shake && now - G.shake < 350) gx += Math.sin((now - G.shake) / 1000 * 46) * 0.06;
    drawCat(i, gx, gy, pose, sx, sy, dir);
  });
  G.boxes.forEach(k => boxFront(k % G.w, Math.floor(k / G.w)));
}

// -------------------------------------------------------------------- input
let sx0 = 0, sy0 = 0, down = false;
const app = document.getElementById("app");
app.addEventListener("pointerdown", e => {
  if (e.target.closest("button, a")) return;
  down = true; sx0 = e.clientX; sy0 = e.clientY;
});
app.addEventListener("pointerup", e => {
  if (!down) return; down = false;
  const dx = e.clientX - sx0, dy = e.clientY - sy0;
  if (Math.hypot(dx, dy) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});
app.addEventListener("pointercancel", () => { down = false; });
addEventListener("keydown", e => {
  const k = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right" }[e.key];
  if (k) { e.preventDefault(); move(k); }
  else if (e.key === "z") undo();
  else if (e.key === "r") restart();
});

// The store link. Inside an ad, MRAID opens the store; on a web page, a tab.
function openStore(e) {
  if (e) e.preventDefault();
  if (window.mraid && typeof mraid.open === "function") mraid.open(PLAY_URL);
  else window.open(PLAY_URL, "_blank", "noopener");
}
document.getElementById("b-undo").onclick = undo;
document.getElementById("b-restart").onclick = restart;
document.getElementById("w-replay").onclick = () => { hide("win"); restart(); };
document.getElementById("w-next").onclick = () => {
  hide("win");
  if (G.level + 1 < LEVELS.length) load(G.level + 1); else show("end");
};
document.getElementById("e-store").onclick = openStore;
document.getElementById("l-store").onclick = openStore;
document.getElementById("e-again").onclick = () => { hide("end"); load(0); };

// -------------------------------------------------------------------- start
function start() {
  const jobs = [];
  for (const c of COLOURS) {
    IMG[c] = {};
    for (const pose of Object.keys(SPRITES[c])) {
      const im = new Image(); im.src = SPRITES[c][pose]; IMG[c][pose] = im;
      jobs.push(im.decode ? im.decode().catch(() => {}) : Promise.resolve());
    }
  }
  Promise.all(jobs).then(() => { load(0); requestAnimationFrame(frame); });
}
if (window.mraid && mraid.getState && mraid.getState() === "loading") mraid.addEventListener("ready", start);
else start();
</script>
